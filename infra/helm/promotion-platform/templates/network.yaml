apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-internal-ingress}
spec:
  podSelector:
    matchLabels: {platform: promotion-platform}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {platform: promotion-platform}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-ingress}
spec:
  podSelector:
    matchLabels: {app: api-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {promotion-ingress: "true"}
      ports: [{protocol: TCP, port: 8080}]
