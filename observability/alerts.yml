groups:
  - name: platform-baseline
    rules:
      - alert: ServiceUnavailable
        expr: up{job="promotion-platform"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "A promotion service cannot be scraped"}
      - alert: HighServerErrorRate
        expr: sum by(instance)(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum by(instance)(rate(http_server_requests_seconds_count[5m])), 0.01) > 0.02
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "HTTP 5xx fraction exceeds provisional 2% threshold"}
      - alert: ConnectionPoolPending
        expr: hikaricp_connections_pending > 2
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Database connections are waiting; inspect pool/locks"}
