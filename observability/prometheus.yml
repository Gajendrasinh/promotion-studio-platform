global:
  scrape_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: promotion-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080", "promotion-service:8081", "rule-engine-service:8082", "customer-service:8083", "eligibility-service:8084", "redemption-service:8085"]
