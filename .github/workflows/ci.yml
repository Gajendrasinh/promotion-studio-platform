name: Verify promotion platform
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.12.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: frontend-browser-results, path: frontend/test-results, retention-days: 7}
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -ntp clean verify
      - name: Require PostgreSQL integration tests
        run: python3 ../scripts/check-postgres-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-results, path: 'backend/**/target/surefire-reports', retention-days: 7}
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan secrets and dependency manifests
        uses: aquasecurity/trivy-action@0.33.1
        with: {scan-type: fs, scan-ref: '.', scanners: 'vuln,secret,misconfig', severity: 'CRITICAL,HIGH', exit-code: '1'}
  images:
    needs: [frontend, backend, security]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, promotion-service, rule-engine-service, customer-service, eligibility-service, redemption-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        if: matrix.service != 'frontend'
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t platform/${{ matrix.service }}:${{ github.sha }} backend
      - name: Build frontend image
        if: matrix.service == 'frontend'
        run: docker build --build-arg VITE_LOCAL_AUTH=false -t platform/frontend:${{ github.sha }} frontend
      - uses: aquasecurity/trivy-action@0.33.1
        with: {image-ref: 'platform/${{ matrix.service }}:${{ github.sha }}', severity: 'CRITICAL,HIGH', exit-code: '1'}
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.33.1
        with: {image-ref: 'platform/${{ matrix.service }}:${{ github.sha }}', format: cyclonedx, output: '${{ matrix.service }}.cdx.json'}
      - uses: actions/upload-artifact@v4
        with: {name: 'sbom-${{ matrix.service }}', path: '${{ matrix.service }}.cdx.json'}
