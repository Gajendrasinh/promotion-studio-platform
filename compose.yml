name: promotion-platform
x-backend: &backend
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp", "/app/data:uid=10001,gid=10001"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    postgres: {condition: service_healthy}
    kafka: {condition: service_started}
  networks: [private]
x-environment: &environment
  SPRING_PROFILES_ACTIVE: local
  SERVER_ADDRESS: 0.0.0.0
  DATABASE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_FLYWAY_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  EVENTS_ENABLED: "true"
  PROMOTION_URL: http://promotion-service:8081
  RULE_URL: http://rule-engine-service:8082
  CUSTOMER_URL: http://customer-service:8083
  ELIGIBILITY_URL: http://eligibility-service:8084
  REDEMPTION_URL: http://redemption-service:8085
services:
  api-gateway:
    <<: *backend
    build:
      context: ./backend
      args: {SERVICE: api-gateway}
    environment:
      <<: *environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/api_gateway
    ports: ["127.0.0.1:8080:8080"]
  promotion-service:
    <<: *backend
    build:
      context: ./backend
      args: {SERVICE: promotion-service}
    environment:
      <<: *environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/promotion_service
  rule-engine-service:
    <<: *backend
    build:
      context: ./backend
      args: {SERVICE: rule-engine-service}
    environment:
      <<: *environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/rule_engine_service
  customer-service:
    <<: *backend
    build:
      context: ./backend
      args: {SERVICE: customer-service}
    environment:
      <<: *environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/customer_service
  eligibility-service:
    <<: *backend
    build:
      context: ./backend
      args: {SERVICE: eligibility-service}
    environment:
      <<: *environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/eligibility_service
  redemption-service:
    <<: *backend
    build:
      context: ./backend
      args: {SERVICE: redemption-service}
    environment:
      <<: *environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/redemption_service
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:8080"]
    depends_on: [api-gateway]
    networks: [private]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data", "./infra/init-databases.sql:/docker-entrypoint-initdb.d/10-services.sql:ro"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--protected-mode", "yes"]
    networks: [private]
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    networks: [private]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    ports: ["127.0.0.1:8180:8080"]
    volumes: ["keycloak-data:/opt/keycloak/data"]
    networks: [private]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yml:/etc/otelcol/config.yaml:ro"]
    networks: [private]
  prometheus:
    image: prom/prometheus:v3.6.0
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./observability/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    networks: [private]
  grafana:
    image: grafana/grafana:12.2.0
    ports: ["127.0.0.1:3001:3000"]
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}"}
    volumes: ["./observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro", "grafana-data:/var/lib/grafana"]
    networks: [private]
networks:
  private: {}
volumes:
  postgres-data: {}
  kafka-data: {}
  keycloak-data: {}
  grafana-data: {}
